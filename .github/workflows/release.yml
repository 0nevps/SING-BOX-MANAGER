name: Validate and package
on:
  push:
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - run: bash -n install.sh
  package:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/package.py "$GITHUB_REF_NAME"
      - name: Create prerelease for deployment validation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "dist/sbmanager-$GITHUB_REF_NAME.tar.gz" dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" "dist/sbmanager-$GITHUB_REF_NAME.tar.gz" dist/SHA256SUMS --verify-tag --prerelease --title "$GITHUB_REF_NAME (Linux validation pending)" --notes 'Development prerelease for Linux integration testing. systemd, ACME issuance, and real client connectivity are not yet validated. Do not use on a production VPS.'
          fi
